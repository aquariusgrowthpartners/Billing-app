# Nixpacks detects pnpm from pnpm-lock.yaml and runs `pnpm install` in its
# install phase, which failed on Railway. These phases pin npm explicitly.
#
# --include=dev is required: react, vite and esbuild are devDependencies, and
# Railway sets NODE_ENV=production, which makes plain `npm install` omit them.
#
# The build also copies client/dist to ./dist: Nixpacks' Node provider tries to
# COPY /app/dist into the final image, and Vite writes to client/dist, so
# without this the image build fails with "/app/dist: not found".
[phases.setup]
nixPkgs = ["nodejs_20", "python3", "gccStdenv", "gnumake"]

[phases.install]
cmds = ["npm install --include=dev --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build", "mkdir -p dist && cp -r client/dist/. dist/"]

[start]
cmd = "node server/index.js"
