<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is REQUIRED for env(safe-area-inset-*) to be
         non-zero on iOS; without it the bottom bar sits under the home
         indicator and padding-bottom: env(...) resolves to 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Billing Calendar</title>
  </head>
  <body>
    <!-- VERSION 2 -->
    <script>
      /*
       * DEBUG: capture fatal errors before the React bundle loads.
       *
       * This is intentionally plain DOM and runs first, so it still works when
       * the module bundle has a syntax error or React never mounts. It replaces
       * the page with a readable red panel instead of leaving a blank screen.
       */
      (function () {
        function show(title, message, meta) {
          try {
            var safe = function (value) {
              return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            };
            document.body.innerHTML =
              '<div id="global-fatal-error" style="position:fixed;inset:0;z-index:2147483647;overflow:auto;padding:20px;' +
              'color:#b00020;background:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;' +
              'font-size:16px;line-height:1.5;-webkit-overflow-scrolling:touch;">' +
              '<h2 style="margin:0 0 12px;font-size:22px;">' + safe(title) + '</h2>' +
              '<p style="margin:0 0 8px;font-weight:700;">Please screenshot or copy this text and send it back.</p>' +
              '<pre style="white-space:pre-wrap;word-break:break-word;background:#fee2e2;padding:12px;border-radius:8px;">' +
              safe(message) + '</pre>' +
              '<pre style="white-space:pre-wrap;word-break:break-word;">' + safe(meta) + '</pre>' +
              '</div>';
          } catch (_) {
            /* last resort: nothing else we can do */
          }
        }

        window.addEventListener('error', function (e) {
          var message = e.message || 'Unknown error';
          var meta = (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || '');
          var stack = e.error && e.error.stack ? e.error.stack : '';
          show('GLOBAL JS ERROR', message, meta + (stack ? '\n\n' + stack : ''));
        });

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          var detail;
          try {
            detail = reason && reason.stack
              ? reason.stack
              : typeof reason === 'string'
                ? reason
                : JSON.stringify(reason);
          } catch (_) {
            detail = String(reason);
          }
          show('UNHANDLED PROMISE REJECTION', detail, '');
        });

        /*
         * Bundle watchdog: if React never puts anything inside #root, the
         * module failed to load or parse. Show that instead of an empty page.
         */
        window.setTimeout(function () {
          if (document.getElementById('global-fatal-error')) return;
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            show(
              'APP DID NOT BOOT — VERSION 2',
              'The JavaScript bundle did not render anything within 8 seconds. ' +
                'This usually means the bundle failed to download, hit a syntax error, ' +
                'or iOS Safari is still serving an old cached index.html.',
              navigator.userAgent || ''
            );
          }
        }, 8000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
